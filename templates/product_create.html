<!DOCTYPE html>
<html>
<head>
    <title>商品追加</title>
</head>
<body>
    <h1>商品追加</h1>

    <form method="POST">
        <p>
            商品名：<input type="text" name="name">
        </p>
        <p>
            価格：<input type="number" name="price">
        </p>
        <p>
            在庫：<input type="number" name="stock">
        </p>
        <p>
            <button type="submit">登録</button>
        </p>
    </form>

    <a href="/">一覧に戻る</a>
</body>
</html>
