<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン - カフェ在庫管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f5f0; color: #4e342e; }
        .login-card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background-color: white; }
        .btn-cafe { background-color: #8d6e63; color: white; border-radius: 25px; }
        .btn-cafe:hover { background-color: #6d4c41; color: white; }
        .form-control { border-radius: 10px; padding: 12px; }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="login-card p-5 mt-5">
                <h2 class="text-center mb-4 fw-bold" style="color: #6d4c41;">☕ Login</h2>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">ユーザー名</label>
                        <input type="text" name="username" class="form-control" placeholder="ユーザー名を入力" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">パスワード</label>
                        <input type="password" name="password" class="form-control" placeholder="パスワードを入力" required>
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-cafe btn-lg">ログイン</button>
                    </div>
                    <div class="text-center">
                        <p class="small text-secondary">アカウントをお持ちでないですか？<br>
                        <a href="/register" class="text-decoration-none" style="color: #8d6e63; font-weight: bold;">新規ユーザー登録</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
