<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>入出庫登録 - カフェ在庫管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f5f0;
            color: #4e342e;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
        }
        .card-custom {
            background-color: #ffffff;
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 50px;
        }
        .btn-cafe {
            background-color: #8d6e63;
            color: white;
            border-radius: 25px;
            font-weight: bold;
            padding: 10px 30px;
        }
        .btn-cafe:hover {
            background-color: #6d4c41;
            color: white;
        }
        .form-label {
            color: #6d4c41;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom p-4">
                <h1 class="text-center mb-4" style="color: #6d4c41; font-weight: bold;">📦 入出庫登録</h1>
                
                <form method="POST">
                    <div class="mb-3">
                        <label for="product_id" class="form-label small">対象商品</label>
                        <select class="form-select" id="product_id" name="product_id" required>
                            <option value="" disabled selected>商品を選択してください</option>
                            {% for product in products %}
                            <option value="{{ product.id }}">{{ product.name }} (現在: {{ product.stock }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="type" class="form-label small">種類</label>
                        <select class="form-select" id="type" name="type" required>
                            <option value="入庫">📥 入庫（在庫を増やす）</option>
                            <option value="出庫">📤 出庫（在庫を減らす）</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="quantity" class="form-label small">数量</label>
                        <input type="number" class="form-control" id="quantity" name="quantity" min="1" placeholder="個数を入力" required>
                    </div>

                    <div class="text-center d-grid gap-2">
                        <button type="submit" class="btn btn-cafe">登録する</button>
                        <a href="/" class="btn btn-link text-secondary text-decoration-none small">一覧に戻る</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
