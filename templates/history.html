<!DOCTYPE html>
<html>
<head>
    <title>履歴一覧</title>
</head>
<body>

    <h1>入出庫履歴</h1>

    <a href="/">一覧に戻る</a>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>商品名</th>
            <th>種類</th>
            <th>数量</th>
            <th>日時</th>
        </tr>

        {% for h in histories %}
        <tr>
            <td>{{ h['id'] }}</td>
            <td>{{ h['name'] }}</td>
            <td>
                {% if h['type'] == 'in' %}
                    入庫
                {% else %}
                    出庫
                {% endif %}
            </td>
            <td>{{ h['quantity'] }}</td>
            <td>{{ h['created_at'] }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
