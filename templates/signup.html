<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>
<body>
    <h1>ログイン</h1>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul style="color: blue;">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST">
        <p>
            ユーザー名：<br>
            <input type="text" name="username" required>
        </p>
        <p>
            パスワード：<br>
            <input type="password" name="password" required>
        </p>
        <p>
            <button type="submit">ログイン</button>
        </p>
    </form>
    <p><a href="{{ url_for('signup') }}">新規登録はこちら</a></p>
</body>
</html>
